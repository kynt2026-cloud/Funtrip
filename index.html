<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fun Trip Countdown</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 10% 15%,
            rgba(255, 80, 160, .65),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(70, 180, 255, .60),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 90%,
            rgba(160, 80, 255, .65),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 90%,
            rgba(255, 170, 70, .40),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #07121e 0%,
            #172b55 30%,
            #54266f 65%,
            #11152e 100%
        );

    background-size: 180% 180%;

    animation:
        gradientFlow 14s ease infinite;

    overflow: hidden;
}


/* =========================
   BACKGROUND OVERLAY
========================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,.14),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            rgba(5,15,40,.05),
            rgba(5,5,25,.45)
        );

    pointer-events: none;

    z-index: 0;
}


/* =========================
   MAIN CARD
========================= */

.card {
    position: relative;

    z-index: 1;

    width: min(1200px, 94vw);

    padding:
        clamp(24px, 4vw, 54px);

    border:
        1px solid rgba(255,255,255,.42);

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.06) 45%,
            rgba(150,90,255,.12)
        );

    backdrop-filter: blur(12px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.38),
        0 0 100px rgba(139,92,246,.22);
}


/* =========================
   KICKER
========================= */

.kicker {
    font-size:
        clamp(14px, 2vw, 22px);

    letter-spacing: .34em;

    text-align: center;
}


/* =========================
   TITLE
========================= */

.title {
    margin:
        8px 0 0;

    text-align: center;

    font-size:
        clamp(48px, 8vw, 104px);

    font-weight: 900;

    letter-spacing: .02em;

    background:
        linear-gradient(
            90deg,
            #ffd166,
            #ff5fa2,
            #9b8cff,
            #55cfff,
            #ffd166
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        textGradient 7s ease infinite;

    text-shadow:
        0 5px 25px rgba(0,0,0,.25);
}


/* =========================
   SUBTITLE
========================= */

.subtitle {
    text-align: center;

    font-size:
        clamp(13px, 1.8vw, 21px);

    letter-spacing: .16em;

    margin:
        5px 0 34px;
}


/* =========================
   START TEXT
========================= */

.start {
    text-align: center;

    font-weight: 700;

    letter-spacing: .18em;

    font-size:
        clamp(14px, 2vw, 21px);

    background:
        linear-gradient(
            90deg,
            #ffd166,
            #ff7ab8,
            #9b8cff,
            #6dd5ff,
            #ffd166
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        textGradient 7s ease infinite;
}


/* =========================
   DATE
========================= */

.date {
    text-align: center;

    font-size:
        clamp(30px, 5vw, 62px);

    font-weight: 800;

    margin:
        10px 0 26px;
}


/* =========================
   COUNTDOWN GRID
========================= */

.grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 14px;
}


/* =========================
   COUNTDOWN BOX
========================= */

.box {
    position: relative;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(25,25,65,.48)
        );

    border:
        1px solid rgba(255,255,255,.25);

    border-radius: 17px;

    padding:
        20px 10px;

    text-align: center;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.15),
        0 10px 30px rgba(0,0,0,.12);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.box::before {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    top: -80px;
    left: -80px;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.15),
            transparent 70%
        );

    pointer-events: none;
}

.box:hover {
    transform:
        translateY(-6px);

    box-shadow:
        0 15px 35px rgba(0,0,0,.25),
        0 0 25px rgba(150,100,255,.15);
}


/* =========================
   NUMBER
========================= */

.num {
    font-size:
        clamp(42px, 7vw, 78px);

    font-weight: 900;

    line-height: 1;
}


/* =========================
   LABEL
========================= */

.label {
    margin-top: 9px;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: .15em;

    background:
        linear-gradient(
            90deg,
            #ffd166,
            #ff7ab8,
            #9b8cff,
            #6dd5ff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}


/* =========================
   TODAY
========================= */

.today {
    width: max-content;

    max-width: 100%;

    margin:
        20px auto 0;

    padding:
        11px 20px;

    border:
        1px solid rgba(255,255,255,.25);

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(255,95,162,.16),
            rgba(88,166,255,.14),
            rgba(156,92,255,.16)
        );

    font-size:
        clamp(13px, 1.7vw, 18px);

    letter-spacing: .08em;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10);
}

.today b {
    background:
        linear-gradient(
            90deg,
            #ffd166,
            #ff7ab8,
            #9b8cff,
            #6dd5ff
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        textGradient 7s ease infinite;
}


/* =========================
   MESSAGE
========================= */

.message {
    text-align: center;

    font-size:
        clamp(20px, 3vw, 34px);

    font-style: italic;

    margin:
        24px 0 12px;

    text-shadow:
        0 3px 15px rgba(0,0,0,.25);
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;

    font-size: 12px;

    letter-spacing: .18em;

    opacity: .85;
}


/* =========================
   GRADIENT ANIMATIONS
========================= */

@keyframes gradientFlow {

    0% {
        background-position:
            0% 50%;
    }

    50% {
        background-position:
            100% 50%;
    }

    100% {
        background-position:
            0% 50%;
    }
}


@keyframes textGradient {

    0% {
        background-position:
            0% 50%;
    }

    50% {
        background-position:
            100% 50%;
    }

    100% {
        background-position:
            0% 50%;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .card {
        padding:
            22px 16px;

        border-radius:
            20px;
    }

    .grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

}


/* =========================
   VERY SMALL SCREENS
========================= */

@media(max-width:380px) {

    .card {
        padding:
            18px 12px;
    }

    .grid {
        gap: 9px;
    }

    .box {
        padding:
            16px 6px;
    }

    .subtitle {
        letter-spacing:
            .08em;
    }

    .footer {
        font-size:
            9px;
    }

}

</style>
</head>


<body>


<!-- ==========================
     BACKGROUND MUSIC
=========================== -->

<audio
    id="bgMusic"
    preload="auto"
    autoplay
    loop>

    <source
        src="Tame%20Impala%20-%20Loser%20-%20LatinHype.mp3"
        type="audio/mpeg">

</audio>


<!-- ==========================
     MAIN CONTENT
=========================== -->

<main class="card">


    <div class="kicker">
        TRACK YOUR
    </div>


    <div class="title">
        FUN TRIP
    </div>


    <div class="subtitle">
        ADVENTURE AWAITS · MEMORIES FOREVER
    </div>


    <div class="start">
        TRIP STARTS ON
    </div>


    <div class="date">
        29 SEPTEMBER
    </div>


    <!-- ==========================
         COUNTDOWN
    =========================== -->

    <section
        class="grid"
        aria-label="Countdown">


        <div class="box">

            <div
                class="num"
                id="days">

                00

            </div>

            <div class="label">
                DAYS
            </div>

        </div>


        <div class="box">

            <div
                class="num"
                id="hours">

                00

            </div>

            <div class="label">
                HOURS
            </div>

        </div>


        <div class="box">

            <div
                class="num"
                id="minutes">

                00

            </div>

            <div class="label">
                MINUTES
            </div>

        </div>


        <div class="box">

            <div
                class="num"
                id="seconds">

                00

            </div>

            <div class="label">
                SECONDS
            </div>

        </div>


    </section>


    <!-- ==========================
         TODAY
    =========================== -->

    <div class="today">

        TODAY IS

        <b id="today">
            --
        </b>

    </div>


    <!-- ==========================
         MESSAGE
    =========================== -->

    <div class="message">
        Let the adventure begin!
    </div>


    <!-- ==========================
         FOOTER
    =========================== -->

    <div class="footer">

        EXPLORE
        &nbsp; · &nbsp;

        CAPTURE
        &nbsp; · &nbsp;

        EXPERIENCE
        &nbsp; · &nbsp;

        DISCOVER
        &nbsp; · &nbsp;

        ENJOY

    </div>


</main>


<script>


/* =================================
   COUNTDOWN
================================= */


/*
   Trip date:
   29 September 2026
   Midnight IST
*/

const targetDate =
    new Date(
        "2026-09-29T00:00:00+05:30"
    );


function updateCountdown() {


    const now =
        new Date();


    const difference =
        targetDate.getTime()
        -
        now.getTime();


    /* ==========================
       TRIP HAS STARTED
    =========================== */

    if (difference <= 0) {


        document.getElementById(
            "days"
        ).textContent =
            "00";


        document.getElementById(
            "hours"
        ).textContent =
            "00";


        document.getElementById(
            "minutes"
        ).textContent =
            "00";


        document.getElementById(
            "seconds"
        ).textContent =
            "00";


        document.querySelector(
            ".date"
        ).textContent =
            "🎉 THE TRIP HAS BEGUN! 🎉";


        document.querySelector(
            ".message"
        ).textContent =
            "Adventure time! 🚀✈️🏖️";


    }


    /* ==========================
       COUNTDOWN RUNNING
    =========================== */

    else {


        const days =
            Math.floor(
                difference /
                (1000 * 60 * 60 * 24)
            );


        const hours =
            Math.floor(
                (
                    difference /
                    (1000 * 60 * 60)
                ) % 24
            );


        const minutes =
            Math.floor(
                (
                    difference /
                    (1000 * 60)
                ) % 60
            );


        const seconds =
            Math.floor(
                (
                    difference /
                    1000
                ) % 60
            );


        document.getElementById(
            "days"
        ).textContent =
            String(days)
            .padStart(2, "0");


        document.getElementById(
            "hours"
        ).textContent =
            String(hours)
            .padStart(2, "0");


        document.getElementById(
            "minutes"
        ).textContent =
            String(minutes)
            .padStart(2, "0");


        document.getElementById(
            "seconds"
        ).textContent =
            String(seconds)
            .padStart(2, "0");

    }


    /* ==========================
       TODAY'S DATE
    =========================== */

    const today =
        new Intl.DateTimeFormat(
            "en-IN",
            {
                day: "2-digit",

                month: "long",

                year: "numeric",

                timeZone:
                    "Asia/Kolkata"
            }
        ).format(now);


    document.getElementById(
        "today"
    ).textContent =
        today.toUpperCase();

}


/* =================================
   MUSIC
================================= */

const music =
    document.getElementById(
        "bgMusic"
    );


/*
   Try to play music automatically.
   Some browsers block audible autoplay.
*/

function startMusic() {

    music.volume = 1.0;

    const playPromise =
        music.play();


    if (playPromise !== undefined) {

        playPromise.catch(
            function(error) {

                console.log(
                    "Autoplay blocked by browser:",
                    error
                );

            }
        );

    }

}


/*
   Try autoplay when page loads.
*/

window.addEventListener(
    "load",
    function() {

        startMusic();

    }
);


/*
   If the browser blocks autoplay,
   start the music after the first
   user interaction.

   There is NO button displayed.
*/

[
    "click",
    "touchstart",
    "keydown",
    "pointerdown"
].forEach(
    function(eventName) {

        document.addEventListener(
            eventName,

            function() {

                if (music.paused) {

                    startMusic();

                }

            },

            {
                once: true
            }
        );

    }
);


/* =================================
   START COUNTDOWN
================================= */

updateCountdown();


setInterval(
    updateCountdown,
    1000
);


</script>


</body>
    </html>
